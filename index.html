<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site is light only — there is no theme toggle and no dark
         override — so this is a constant. -->
    <meta name="theme-color" content="#efeae0" />
    <!-- One first-party file doing the three things that must happen in the
         head: resolve the theme before first paint (so there is no flash of
         the wrong one), initialise Google Analytics, and promote the
         preloaded font stylesheet once it arrives. They are in a file rather
         than an inline block because the production CSP has no
         'unsafe-inline' in script-src — and in ONE file because that used to
         cost four blocking requests. -->
    <script src="/boot.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2TCETV3EDR"></script>

    <!-- KEEP IN SYNC with routeSEO['/'] in src/data/seo.ts. The static-route
         plugin regenerates every other route's tags from that file but skips
         "/", so these two are the homepage's only source of truth and they
         must match byte for byte. -->
    <title>wibsity — custom websites, built from scratch | India</title>
    <meta
      name="description"
      content="A web studio in India building custom websites by hand — no page builder, no bought theme. Fixed price agreed before we start, live in about a week."
    />
    <meta name="author" content="wibsity" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <link rel="canonical" href="https://wibsity.in/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wibsity.in/" />
    <meta property="og:site_name" content="wibsity" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="wibsity — custom websites, built from scratch | India" />
    <meta
      property="og:description"
      content="wibsity builds websites, automations and digital experiences by hand — no page builder, no bought theme. Fixed price agreed before anything starts, live in about a week."
    />
    <meta property="og:image" content="https://wibsity.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="wibsity — websites, automations and digital experiences, built by hand" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wibsity.in/" />
    <meta name="twitter:title" content="wibsity — custom websites, built from scratch | India" />
    <meta
      name="twitter:description"
      content="wibsity builds websites, automations and digital experiences by hand — no page builder, no bought theme. Fixed price agreed before anything starts, live in about a week."
    />
    <meta name="twitter:image" content="https://wibsity.in/og-image.png" />

    <!-- Favicons & app icons, cropped from the 2026.2 photoreal brand mark
         (public/logo-mark.png, public/logo-mark-512.png; see CLAUDE.md's
         "Icons and the logo" section) rather than generated from vector
         geometry — there is no SVG source for this mark, so no svg favicon
         link. They need an opaque background because they render in contexts
         the site's data-theme cannot reach — tab chrome, search results, JSON-LD. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Two families, one host. Archivo is requested with its WIDTH axis
         (wdth 62..125) as well as weight, because the site animates letterform
         width — the headline sets itself on load, section titles widen on
         hover, and the hero compresses as it scrolls away. Dropping the axis
         silently kills all three. Archivo carries headlines and UI, Newsreader
         carries body copy; the site's third face (JetBrains Mono) went with
         the decorative code panel it existed for, and Fontshare went with
         General Sans and Satoshi — one fewer origin to connect to.

         Loaded with the preload+swap pattern so it does not block first paint
         on a slow connection; boot.js promotes it once it arrives, and the
         <noscript> covers the no-JS case. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap"
      data-font-preload
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Structured data. WebSite + ProfessionalService only; the homepage's
         FAQPage node is a separate block below so the static-route plugin can
         strip it by id when generating the other routes. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://wibsity.in/#website",
          "url": "https://wibsity.in/",
          "name": "wibsity",
          "description": "A web studio in India building custom websites by hand.",
          "publisher": { "@id": "https://wibsity.in/#organization" },
          "inLanguage": "en-IN"
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://wibsity.in/#organization",
          "name": "wibsity",
          "url": "https://wibsity.in/",
          "logo": "https://wibsity.in/logo-mark-512.png",
          "image": "https://wibsity.in/logo-mark-512.png",
          "description": "wibsity is a web studio in India that builds websites, automations and digital experiences by hand — no page builder, no bought theme — at a fixed price agreed before the project starts.",
          "telephone": "+918448948791",
          "email": "wibsityofficial@gmail.com",
          "priceRange": "$$",
          "areaServed": { "@type": "Country", "name": "India" },
          "address": { "@type": "PostalAddress", "addressCountry": "IN" },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
              "opens": "09:00",
              "closes": "20:00"
            }
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Web design and development services",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Websites",
                  "description": "The site your business runs on — built new, replaced when it has aged badly, or narrowed to one page for a single campaign. Includes landing pages, redesigns, basic SEO, local SEO and performance optimization."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Online store",
                  "description": "A storefront that takes orders and payments, sized to the catalogue you actually have."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Automation",
                  "description": "Software that takes over the repetitive parts of running a business — catching leads, sending notifications, and moving information where it needs to go."
                }
              }
            ]
          }
        }
      ]
    }
    </script>
    <!-- The three questions the homepage actually shows, copied by hand from
         faqsData[0..2] in src/data/faqs.ts. Editing or reordering those three
         means editing this block in the same change. Kept in its own script so
         vite.config.ts can strip it by id from every other generated route. -->
    <script id="home-faq-jsonld" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "https://wibsity.in/#homepage-faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Why not just use a template or a website builder?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For some businesses that is genuinely the right answer, and we will say so on the call rather than sell you something larger. What you give up is control. A template arrives carrying code for every feature its author imagined, most of which your site will never use, and every change afterwards happens inside somebody else’s rules. A built site contains what your site needs and nothing else, and it can be changed by editing it."
          }
        },
        {
          "@type": "Question",
          "name": "How does pricing work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fixed price, agreed in writing before anything starts. After one conversation you get a written scope, a number and a date. If you later want something outside that scope, it is quoted separately rather than absorbed into a bill you see at the end. There are no retainers and no hourly billing."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Three to five working days for a standard business site, longer for stores and anything with custom functionality. The dates are confirmed in writing before the project starts. What usually slows a project down is waiting on content, so we tell you exactly what we need from you at the start."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

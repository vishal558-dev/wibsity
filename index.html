    <!-- Sets data-theme before first paint to avoid a flash of the wrong theme.
         Mirrors src/hooks/useTheme.ts's resolution logic exactly (same
         localStorage key, same matchMedia query) — it can't import that
         hook directly because it must run before any JS bundle loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wibsity-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- SPA redirect decode script for direct deep link reloads on static hosts -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Favicons & App Icons.
         favicon.ico bundles 16/32/48/96px frames; the explicit 96x96 <link>
         is also here because Google's favicon guidelines specifically want
         a linked (not just ICO-embedded) icon at >=48px, recommending 96px
         for retina — see CLAUDE.md's favicon note. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <!-- Fontshare: General Sans & Satoshi (Premium Modern Grotesks)
         Google Fonts: JetBrains Mono for supporting technical metadata
         Loaded via the preload+swap pattern so these third-party stylesheets
         don't block the initial paint on a slow mobile connection — the
         browser fetches them in parallel with everything else, then swaps
         them in as regular stylesheets once ready. The <noscript> fallback
         covers the no-JS case. font-display=swap in each URL still governs
         in-page text visibility while each font family itself loads. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700,800,900&f[]=satoshi@300,400,500,700,900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700,800,900&f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
